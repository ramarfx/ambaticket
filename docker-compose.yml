name: ambaticket

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ambaticket
      POSTGRES_PASSWORD: ambaticket
      POSTGRES_DB: ambaticket
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ambaticket -d ambaticket']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgres://ambaticket:ambaticket@db:5432/ambaticket
      PAYMENT_WEBHOOK_SECRET: dev-webhook-secret
      ORDER_TTL_SECONDS: 900
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const r = await fetch('http://127.0.0.1:3000/'); process.exit(r.ok ? 0 : 1)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    deploy:
      replicas: 3

  web:
    build:
      context: ./frontend
    ports:
      - '3000:3000'
      - '8081:8080'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  test:
    profiles: ['test']
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: postgres://ambaticket:ambaticket@db:5432/ambaticket_test
      PAYMENT_WEBHOOK_SECRET: dev-webhook-secret
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

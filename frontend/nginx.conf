# DNS internal Docker, supaya replika API yang naik atau turun ikut terbaca.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream ambaticket_api {
  zone api 64k;
  server api:3000 resolve max_fails=3 fail_timeout=10s;
}

gzip on;
gzip_types application/json text/css application/javascript image/svg+xml;
gzip_min_length 1024;

# Pintu API: alamat lama localhost:3000 tetap dipakai skrip dan curl.
server {
  listen 3000;
  server_name _;

  location / {
    proxy_pass http://ambaticket_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Api-Upstream $upstream_addr always;
  }
}

# Pintu FE: berkas statis, dan /api diteruskan ke upstream yang sama.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://ambaticket_api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}

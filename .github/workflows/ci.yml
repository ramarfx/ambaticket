name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://ambaticket:ambaticket@localhost:5432/ambaticket_test
      PAYMENT_WEBHOOK_SECRET: dev-webhook-secret
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ambaticket
          POSTGRES_PASSWORD: ambaticket
          POSTGRES_DB: ambaticket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ambaticket -d ambaticket_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run test:e2e
      - run: bun run build

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Nama image di GHCR harus huruf kecil, nama repo bisa saja tidak.
      - id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag selalu dari commit, bukan latest.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
